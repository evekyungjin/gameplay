<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>게임 등급분류 활동지</title>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #f0f2f5; font-family: sans-serif; overflow: hidden; touch-action: none; }
        
        /* 배경판: 1.jpg (체크리스트 보드판) */
        #board {
            width: 1000px; height: 700px;
            background: url('1.jpg') no-repeat center/contain;
            background-color: white;
            position: relative; margin: 20px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-radius: 10px;
        }
        
        /* 스티커 저장소 (화면 아래쪽) */
        #inventory {
            width: 1000px; height: 120px;
            background: #fff; margin: 10px auto;
            display: flex; align-items: center; justify-content: center;
            gap: 15px; border-radius: 10px; padding: 10px; flex-wrap: wrap;
        }
        
        .sticker {
            width: 60px; height: 60px;
            touch-action: none; user-select: none;
            cursor: grab; object-fit: contain;
        }
        
        /* 이동 중일 때 스타일 */
        .dragging { opacity: 0.8; cursor: grabbing; z-index: 1000; }
    </style>
</head>
<body>

    <div id="board"></div>

    <div id="inventory">
        <img src="12.gif" class="sticker">
        <img src="15.gif" class="sticker">
        <img src="1.gif" class="sticker">
        <img src="2.gif" class="sticker">
        <img src="3.gif" class="sticker">
        <img src="4.gif" class="sticker">
        <img src="5.gif" class="sticker">
        <img src="6.gif" class="sticker">
        <img src="7.gif" class="sticker">
    </div>

    <script>
        // 드래그 로직 (interact.js)
        interact('.sticker').draggable({
            listeners: {
                move (event) {
                    var target = event.target
                    var x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx
                    var y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy

                    target.style.transform = `translate(${x}px, ${y}px)`

                    target.setAttribute('data-x', x)
                    target.setAttribute('data-y', y)
                },
                start (event) { event.target.classList.add('dragging') },
                end (event) { event.target.classList.remove('dragging') }
            }
        })
    </script>
</body>
</html>
